name: SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check:permissions
      - run: bun run typecheck
      - run: bun run build:examples
      - run: bun run build:plugins
      - run: bun run test
      - run: bun run test:examples
      - run: bun run test:plugins
      - run: git diff --exit-code -- examples/bundles plugins/bundles
